<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#3a6b5c"/>
<title>Cartões de Designação</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f4ee;color:#1c2826;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:16px}

/* Layout */
#app{padding-bottom:80px}
header{background:#fff;border-bottom:1.5px solid #e3ddd0;padding:16px 20px 14px;position:sticky;top:0;z-index:10}
header h1{font-size:21px;font-weight:800;letter-spacing:-0.3px}
header p{font-size:13px;color:#6f6a5e;margin-top:3px}
main{max-width:720px;margin:0 auto;padding:18px 16px 20px}

/* Navegação */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1.5px solid #e3ddd0;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#6f6a5e}
nav button.ativo{color:#3a6b5c;font-weight:700}
nav button svg{display:block}

/* Cards */
.card{background:#fff;border:1.5px solid #e3ddd0;border-radius:16px;padding:16px;margin-bottom:12px}

/* Campos */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:#6f6a5e;margin-bottom:6px;letter-spacing:0.2px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid #e3ddd0;border-radius:12px;background:#fff;color:#1c2826;outline:none;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3a6b5c}
.field textarea{resize:vertical;min-height:100px;line-height:1.5}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;font-size:16px;font-weight:600;border:none;border-radius:12px;cursor:pointer;color:#fff;background:#3a6b5c;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn:disabled{background:#b8b3a8;box-shadow:none;cursor:default}
.btn.full{width:100%}
.btn.verde{background:#1f8a52}
.btn.perigo{background:#b04a3a}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;font-size:14px;font-weight:600;color:#6f6a5e;background:transparent;border:1.5px solid #e3ddd0;border-radius:10px;cursor:pointer}
.btn-ghost.label-file{cursor:pointer}

/* Preview */
.preview{background:#e8efe9;border:1.5px solid #e3ddd0;border-radius:16px;padding:18px;white-space:pre-wrap;font-size:15.5px;line-height:1.6;margin-bottom:16px}

/* Vazio */
.vazio{text-align:center;padding:48px 20px;color:#6f6a5e}
.vazio .icone{display:inline-flex;padding:16px;border-radius:20px;background:#e8efe9;margin-bottom:14px}
.vazio h3{font-size:17px;font-weight:700;color:#1c2826;margin-bottom:6px}
.vazio p{font-size:14px}

/* Lista */
.item{display:flex;justify-content:space-between;align-items:center}
.item .info{}
.item .info strong{font-size:16px;font-weight:700}
.item .info span{display:block;font-size:14px;color:#6f6a5e;margin-top:2px}
.item .acoes{display:flex;gap:8px}
.icon-btn{background:transparent;border:none;cursor:pointer;padding:8px;border-radius:8px;display:inline-flex}

/* Badge */
.badge{background:#e8efe9;color:#3a6b5c;font-weight:800;font-size:15px;padding:8px 12px;border-radius:10px;min-width:22px;text-align:center}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(28,40,38,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#f6f4ee;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px;max-height:88vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h2{font-size:19px;font-weight:800}

/* Aviso */
.aviso{border-radius:12px;padding:14px;font-size:14px;font-weight:600;margin-bottom:12px}
.aviso.info{background:#e8efe9;color:#3a6b5c}
.aviso.erro{background:#fce8e5;color:#b04a3a}

/* Recentes */
.recente{background:#fff;border:1.5px solid #e3ddd0;border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:14px}
.recente small{display:block;font-size:12px;color:#6f6a5e;margin-top:2px}

/* Topo da aba */
.aba-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.aba-topo span{font-size:14px;color:#6f6a5e;font-weight:600}

/* Exportar CSV botões */
.grupo-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cartões de Designação</h1>
    <p>Cadastre, monte a mensagem e envie pelo WhatsApp</p>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script>
// ===================== IndexedDB =====================
const DB_NAME="designacoesDB", DB_VER=1, STORES=["pessoas","designacoes","registros"];
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const db=e.target.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:"id"});});};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function dbGetAll(store){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
async function dbPut(store,val){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function dbDel(store,id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// ===================== Helpers =====================
function saudacao(){const h=new Date().getHours();return h>=5&&h<12?"Bom dia":h>=12&&h<18?"Boa tarde":"Boa noite";}
function fmtData(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y.slice(2)}`;}
function soDigitos(t){return(t||"").replace(/\D/g,"");}
function montarMensagem({titular,ajudante,desigNum,desigTitulo,dataISO}){
  const l=[];
  l.push(saudacao()+"!");l.push("");
  if(titular)l.push("Titular: "+titular);
  if(ajudante)l.push("Ajudante: "+ajudante);
  if(desigNum||desigTitulo)l.push("Designação N.° "+desigNum+(desigTitulo?" - "+desigTitulo:""));
  if(dataISO)l.push("Data: "+fmtData(dataISO));
  l.push("");l.push("Confirme que está ciente da designação por favor!");
  return l.join("\n");
}

// ===================== Estado global =====================
let pessoas=[], designacoes=[], registros=[], tabAtual="enviar";

async function carregar(){
  [pessoas,designacoes,registros]=await Promise.all([dbGetAll("pessoas"),dbGetAll("designacoes"),dbGetAll("registros")]);
  pessoas.sort((a,b)=>a.nome.localeCompare(b.nome));
  designacoes.sort((a,b)=>(+a.numero||0)-(+b.numero||0));
  registros.sort((a,b)=>b.criadoEm-a.criadoEm);
}

// ===================== SVG =====================
const SVG={
  send:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  users:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  list:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
  file:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  plus:'<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  edit:'<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="#6f6a5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
  trash:'<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" stroke="#b04a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
  x:'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#6f6a5e" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  check:'<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  phone:'<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  down:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  up:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
};

// ===================== Render principal =====================
function render(){
  renderNav();
  const main=document.getElementById("main");
  if(tabAtual==="enviar") renderEnviar(main);
  else if(tabAtual==="pessoas") renderPessoas(main);
  else if(tabAtual==="designacoes") renderDesignacoes(main);
  else if(tabAtual==="dados") renderDados(main);
}

function renderNav(){
  const tabs=[
    {id:"enviar",label:"Enviar",svg:SVG.send},
    {id:"pessoas",label:"Pessoas",svg:SVG.users},
    {id:"designacoes",label:"Designações",svg:SVG.list},
    {id:"dados",label:"Dados",svg:SVG.file},
  ];
  document.getElementById("nav").innerHTML=tabs.map(t=>`
    <button class="${tabAtual===t.id?"ativo":""}" onclick="mudarTab('${t.id}')">
      ${t.svg}<span>${t.label}</span>
    </button>`).join("");
}

function mudarTab(id){tabAtual=id;render();}

// ===================== ABA ENVIAR =====================
function renderEnviar(el){
  if(pessoas.length===0||designacoes.length===0){
    el.innerHTML=`<div class="vazio">
      <div class="icone">${SVG.send}</div>
      <h3>Quase lá</h3>
      <p>${pessoas.length===0?"Cadastre ao menos uma pessoa na aba Pessoas para começar.":"Cadastre ao menos uma designação na aba Designações."}</p>
    </div>`;return;
  }
  const hoje=new Date().toISOString().slice(0,10);
  el.innerHTML=`
    <div class="card">
      <div class="field"><label>Titular (recebe a mensagem)</label>
        <select id="selTitular" onchange="atualizarPreview()">${pessoas.map(p=>`<option value="${p.id}">${p.nome}</option>`).join("")}</select></div>
      <div class="field"><label>Ajudante (opcional — selecione uma pessoa cadastrada)</label>
        <select id="selAjudante" onchange="atualizarPreview()">
          <option value="">— Sem ajudante —</option>
          ${pessoas.map(p=>`<option value="${p.id}">${p.nome}</option>`).join("")}
        </select></div>
      <div class="field"><label>Designação</label>
        <select id="selDesig" onchange="atualizarPreview()">${designacoes.map(d=>`<option value="${d.id}">N.° ${d.numero} - ${d.titulo}</option>`).join("")}</select></div>
      <div class="field"><label>Data</label>
        <input type="date" id="inpData" value="${hoje}" onchange="atualizarPreview()"/></div>
    </div>
    <div style="font-size:13px;font-weight:600;color:#6f6a5e;margin:4px 4px 8px">Pré-visualização da mensagem</div>
    <div class="preview" id="preview"></div>
    <div id="avisoTel"></div>
    <button class="btn full verde" id="btnEnviar" onclick="enviarWA()">
      ${SVG.send} Abrir WhatsApp com a mensagem
    </button>
    ${registros.length>0?`<div style="margin-top:28px">
      <div style="font-size:13px;font-weight:700;color:#6f6a5e;margin-bottom:10px;margin-left:4px">Enviados recentes</div>
      ${registros.slice(0,5).map(r=>`<div class="recente"><strong>${r.titularNome}</strong> — ${r.designacao||"—"}<small>${fmtData(r.dataISO)}</small></div>`).join("")}
    </div>`:""}`;
  atualizarPreview();
}

function dadosEnvio(){
  const tId=document.getElementById("selTitular")?.value;
  const aId=document.getElementById("selAjudante")?.value;
  const dId=document.getElementById("selDesig")?.value;
  const data=document.getElementById("inpData")?.value;
  const titular=pessoas.find(p=>p.id===tId);
  const ajudante=pessoas.find(p=>p.id===aId);
  const desig=designacoes.find(d=>d.id===dId);
  return{titular,ajudante,desig,data};
}

function atualizarPreview(){
  const{titular,ajudante,desig,data}=dadosEnvio();
  const msg=montarMensagem({titular:titular?.nome,ajudante:ajudante?.nome,desigNum:desig?.numero,desigTitulo:desig?.titulo,dataISO:data});
  const prev=document.getElementById("preview");
  const aviso=document.getElementById("avisoTel");
  const btn=document.getElementById("btnEnviar");
  if(prev) prev.textContent=msg;
  const telOk=titular&&soDigitos(titular.telefone).length>=10;
  if(aviso) aviso.innerHTML=titular&&!telOk?`<div class="aviso erro" style="margin-bottom:12px">O telefone de ${titular.nome} parece incompleto. Edite na aba Pessoas.</div>`:"";
  if(btn) btn.disabled=!(titular&&desig&&telOk);
}

async function enviarWA(){
  const{titular,ajudante,desig,data}=dadosEnvio();
  if(!titular||!desig) return;
  const msg=document.getElementById("preview").textContent;
  const tel=soDigitos(titular.telefone);
  const num=tel.startsWith("55")?tel:"55"+tel;
  await dbPut("registros",{id:uid(),criadoEm:Date.now(),titularNome:titular.nome,ajudanteNome:ajudante?.nome||"",designacao:desig?`${desig.numero} - ${desig.titulo}`:"",dataISO:data,mensagem:msg});
  await carregar();
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(msg),"_blank");
  render();
}

// ===================== ABA PESSOAS =====================
function renderPessoas(el){
  el.innerHTML=`
    <div class="aba-topo">
      <span>${pessoas.length} cadastrada(s)</span>
      <button class="btn" onclick="abrirModalPessoa()">${SVG.plus} Nova pessoa</button>
    </div>
    ${pessoas.length===0?`<div class="vazio"><div class="icone">${SVG.users}</div><h3>Nenhuma pessoa ainda</h3><p>Toque em Nova pessoa para cadastrar quem vai receber designações.</p></div>`
    :pessoas.map(p=>`<div class="card"><div class="item">
      <div class="info"><strong>${esc(p.nome)}</strong><span>${SVG.phone} ${esc(p.telefone||"sem telefone")}</span></div>
      <div class="acoes">
        <button class="icon-btn" onclick="abrirModalPessoa('${p.id}')">${SVG.edit}</button>
        <button class="icon-btn" onclick="excluirPessoa('${p.id}')">${SVG.trash}</button>
      </div></div></div>`).join("")}`;
}

function abrirModalPessoa(id){
  const p=pessoas.find(x=>x.id===id)||{};
  mostrarModal(`<div class="modal-header"><h2>${id?"Editar pessoa":"Nova pessoa"}</h2><button class="icon-btn" onclick="fecharModal()">${SVG.x}</button></div>
    <div class="field"><label>Nome</label><input id="mNome" value="${esc(p.nome||"")}" placeholder="Ex: Mirna" autofocus/></div>
    <div class="field"><label>Telefone (com DDD)</label><input id="mTel" value="${esc(p.telefone||"")}" placeholder="Ex: 11 91234-5678" inputmode="tel"/></div>
    <p style="font-size:12px;color:#6f6a5e;margin:-8px 0 16px">O código do país (55) é adicionado automaticamente no envio.</p>
    <button class="btn full" onclick="salvarPessoa('${id||""}')">${SVG.check} Salvar</button>`);
}

async function salvarPessoa(id){
  const nome=document.getElementById("mNome").value.trim();
  if(!nome) return;
  await dbPut("pessoas",{id:id||uid(),nome,telefone:document.getElementById("mTel").value.trim()});
  fecharModal();await carregar();render();
}

async function excluirPessoa(id){
  if(!confirm("Excluir esta pessoa?")) return;
  await dbDel("pessoas",id);await carregar();render();
}

// ===================== ABA DESIGNAÇÕES =====================
function renderDesignacoes(el){
  el.innerHTML=`
    <div class="aba-topo">
      <span>${designacoes.length} cadastrada(s)</span>
      <button class="btn" onclick="abrirModalDesig()">${SVG.plus} Nova designação</button>
    </div>
    ${designacoes.length===0?`<div class="vazio"><div class="icone">${SVG.list}</div><h3>Nenhuma designação ainda</h3><p>Monte aqui o catálogo, ex: 4 - Iniciando Conversas.</p></div>`
    :designacoes.map(d=>`<div class="card"><div class="item">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="badge">${esc(d.numero||"–")}</span>
        <strong style="font-size:16px">${esc(d.titulo||"sem título")}</strong>
      </div>
      <div class="acoes">
        <button class="icon-btn" onclick="abrirModalDesig('${d.id}')">${SVG.edit}</button>
        <button class="icon-btn" onclick="excluirDesig('${d.id}')">${SVG.trash}</button>
      </div></div></div>`).join("")}`;
}

function abrirModalDesig(id){
  const d=designacoes.find(x=>x.id===id)||{};
  mostrarModal(`<div class="modal-header"><h2>${id?"Editar designação":"Nova designação"}</h2><button class="icon-btn" onclick="fecharModal()">${SVG.x}</button></div>
    <div class="field"><label>Número</label><input id="mNum" value="${esc(d.numero||"")}" placeholder="Ex: 4" inputmode="numeric" autofocus/></div>
    <div class="field"><label>Título</label><input id="mTitulo" value="${esc(d.titulo||"")}" placeholder="Ex: Iniciando Conversas"/></div>
    <button class="btn full" onclick="salvarDesig('${id||""}')">${SVG.check} Salvar</button>`);
}

async function salvarDesig(id){
  const numero=document.getElementById("mNum").value.trim();
  const titulo=document.getElementById("mTitulo").value.trim();
  if(!numero&&!titulo) return;
  await dbPut("designacoes",{id:id||uid(),numero,titulo});
  fecharModal();await carregar();render();
}

async function excluirDesig(id){
  if(!confirm("Excluir esta designação?")) return;
  await dbDel("designacoes",id);await carregar();render();
}

// ===================== ABA DADOS =====================
function renderDados(el){
  el.innerHTML=`
    <div class="card">
      <strong style="font-size:16px">Pessoas</strong>
      <p style="font-size:13px;color:#6f6a5e;margin:4px 0 14px">${pessoas.length} cadastrada(s)</p>
      <div class="grupo-btn">
        <button class="btn-ghost" onclick="exportar('pessoas')">${SVG.down} Exportar CSV</button>
        <button class="btn-ghost" onclick="verCSV('pessoas')">${SVG.file} Ver e copiar</button>
        <label class="btn-ghost btn-ghost label-file">${SVG.up} Importar CSV<input type="file" accept=".csv" style="display:none" onchange="importar(event,'pessoas')"/></label>
      </div>
    </div>
    <div class="card">
      <strong style="font-size:16px">Designações</strong>
      <p style="font-size:13px;color:#6f6a5e;margin:4px 0 14px">${designacoes.length} cadastrada(s)</p>
      <div class="grupo-btn">
        <button class="btn-ghost" onclick="exportar('designacoes')">${SVG.down} Exportar CSV</button>
        <button class="btn-ghost" onclick="verCSV('designacoes')">${SVG.file} Ver e copiar</button>
        <label class="btn-ghost btn-ghost label-file">${SVG.up} Importar CSV<input type="file" accept=".csv" style="display:none" onchange="importar(event,'designacoes')"/></label>
      </div>
    </div>
    <div id="avisoExport"></div>
    <p style="font-size:12.5px;color:#6f6a5e;line-height:1.6;margin-top:8px;padding:0 4px">
      Ao importar, registros com o mesmo <strong>id</strong> são atualizados; sem id, são criados novos.
    </p>`;
}

function csvLinhas(tipo){
  if(tipo==="pessoas") return[["id","nome","telefone"],...pessoas.map(p=>[p.id,p.nome,p.telefone])];
  return[["id","numero","titulo"],...designacoes.map(d=>[d.id,d.numero,d.titulo])];
}
function montarCSV(linhas){return linhas.map(l=>l.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");}

async function exportar(tipo){
  const nome=tipo+".csv";
  const csv="\uFEFF"+montarCSV(csvLinhas(tipo));
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  try{
    const file=new File([blob],nome,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:nome});
      return;
    }
  }catch(e){if(e&&e.name==="AbortError")return;}
  // Fallback: link de download
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  mostrarAvisoExport("Arquivo gerado. Verifique em Arquivos › Downloads. Se não aparecer, use 'Ver e copiar'.");
}

function verCSV(tipo){
  const texto=montarCSV(csvLinhas(tipo));
  mostrarModal(`<div class="modal-header"><h2>${tipo}.csv</h2><button class="icon-btn" onclick="fecharModal()">${SVG.x}</button></div>
    <p style="font-size:13px;color:#6f6a5e;margin-bottom:12px">Toque em Copiar e cole no Numbers, Google Sheets ou num e-mail para guardar.</p>
    <textarea id="csvTexto" readonly style="width:100%;padding:12px;border:1.5px solid #e3ddd0;border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:180px;background:#f6f4ee;color:#1c2826" onclick="this.select()">${esc(texto)}</textarea>
    <button class="btn full" style="margin-top:14px" onclick="copiarCSV()">${SVG.check} Copiar conteúdo</button>`);
}

async function copiarCSV(){
  const t=document.getElementById("csvTexto");
  try{await navigator.clipboard.writeText(t.value);alert("Copiado! Cole onde quiser.");}
  catch{t.select();document.execCommand("copy");alert("Copiado!");}
}

function mostrarAvisoExport(msg){
  const el=document.getElementById("avisoExport");
  if(el) el.innerHTML=`<div class="aviso info">${msg}</div>`;
}

function parseCSV(texto){
  const linhas=texto.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  return linhas.map(l=>{const out=[];let cur="",dentro=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(dentro&&l[i+1]==='"'){cur+='"';i++;}else dentro=!dentro;}else if(ch===','&&!dentro){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;});
}

async function importar(e,tipo){
  const file=e.target.files?.[0];if(!file)return;
  const texto=await file.text();
  const linhas=parseCSV(texto);
  if(linhas.length<2){mostrarAvisoExport("Arquivo vazio ou sem dados.");return;}
  const header=linhas[0].map(h=>h.trim().toLowerCase());
  let n=0;
  for(const linha of linhas.slice(1)){
    const obj={};header.forEach((h,i)=>{obj[h]=(linha[i]||"").trim();});
    if(tipo==="pessoas"&&obj.nome){await dbPut("pessoas",{id:obj.id||uid(),nome:obj.nome,telefone:obj.telefone||""});n++;}
    else if(tipo==="designacoes"&&(obj.numero||obj.titulo)){await dbPut("designacoes",{id:obj.id||uid(),numero:obj.numero||"",titulo:obj.titulo||""});n++;}
  }
  mostrarAvisoExport(`${n} registro(s) importado(s) em ${tipo}.`);
  e.target.value="";await carregar();render();
}

// ===================== Modal =====================
function mostrarModal(html){
  const bg=document.createElement("div");
  bg.className="modal-bg";bg.id="modalBg";
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg)fecharModal();});
  document.body.appendChild(bg);
  setTimeout(()=>bg.querySelector("input,select")?.focus(),100);
}
function fecharModal(){document.getElementById("modalBg")?.remove();}

// ===================== Util =====================
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ===================== Inicialização =====================
carregar().then(render).catch(err=>{
  document.getElementById("main").innerHTML=`<div style="padding:30px;color:#b04a3a;font-size:14px;line-height:1.6">
    <strong>Erro ao iniciar o aplicativo.</strong><br>${err}</div>`;
});
</script>
